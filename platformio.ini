; ESP8266 GPS NTP — see HANDOVER.md for design rationale.
;
; Target: NodeMCU 1.0 (ESP-12E / ESP8266MOD), 80 MHz, Arduino framework.
; GPS:    7Semi L89 breakout, 9600 baud NMEA on SoftwareSerial (D2),
;         PPS on D5 (FALLING edge — see HANDOVER.md "PPS verification").
;
; USB-serial port pinned: the NodeMCU's CP2102 enumerates as
; /dev/cu.usbserial-0001 on this Mac. The shack also has a couple of
; FTDI USB-serial cables (GPS dongle, etc.), so auto-detection picks
; the wrong device. If you swap the board and the serial number
; changes, update the two `*_port =` lines below.

[env:nodemcuv2]
platform      = espressif8266
board         = nodemcuv2
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
upload_port   = /dev/cu.usbserial-0001
monitor_port  = /dev/cu.usbserial-0001

lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    tzapu/WiFiManager@^2.0.17
