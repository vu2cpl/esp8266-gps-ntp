; ESP8266 GPS NTP — see HANDOVER.md for design rationale.
;
; Target: NodeMCU 1.0 (ESP-12E / ESP8266MOD), 80 MHz, Arduino framework.
; GPS:    7Semi L89 breakout, 9600 baud NMEA on SoftwareSerial (D2),
;         PPS on D5 (FALLING edge — see HANDOVER.md "PPS verification").

[env:nodemcuv2]
platform      = espressif8266
board         = nodemcuv2
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
