; ESP8266 GPS NTP — see HANDOVER.md for design rationale.
;
; Target: NodeMCU 1.0 (ESP-12E / ESP8266MOD), 80 MHz, Arduino framework.
; GPS:    7Semi L89 breakout, 9600 baud NMEA on SoftwareSerial (D2),
;         PPS on D5 (RISING edge — direct on Quectel L89 pin 6).
;
; USB-serial port intentionally NOT pinned. Multiple shack ESP boards
; ship with Silicon Labs CP2102 chips whose factory-locked default
; serial number is "0001" — pinning would silently flash the wrong
; board whenever two are connected. Use the interactive wrappers:
;     ./flash.sh        # build + upload, prompts when >1 port present
;     ./monitor.sh      # serial monitor, same prompt
; See HANDOVER.md "Known gotchas" for the full investigation.

[env:nodemcuv2]
platform      = espressif8266
board         = nodemcuv2
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DMQTT_MAX_PACKET_SIZE=512

lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    tzapu/WiFiManager@^2.0.17
    knolleary/PubSubClient@^2.8
